<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#c5a059"/>
  <!-- Inner parchment circle -->
  <circle cx="256" cy="256" r="216" fill="#fbf9f5"/>
  <!-- Trumpet Bell & Tubing silhouette in brass & lamp black -->
  <g fill="#775a19" stroke="#4e3700" stroke-width="4">
    <!-- Bell Flare -->
    <path d="M 120 220 C 130 180, 150 140, 200 130 L 200 230 C 160 230, 130 225, 120 220 Z" fill="#c5a059"/>
    <!-- Bell Cone -->
    <path d="M 200 170 L 380 195 L 380 215 L 200 190 Z" fill="#e9c176"/>
    <!-- Lead pipe & main tubing -->
    <path d="M 170 270 L 390 270 C 420 270, 440 250, 440 225 C 440 200, 420 180, 390 180 L 340 180" fill="none" stroke="#775a19" stroke-width="14" stroke-linecap="round"/>
    <!-- Tuning slide curve -->
    <path d="M 170 270 C 130 270, 100 295, 100 325 C 100 355, 130 380, 170 380 L 260 380" fill="none" stroke="#775a19" stroke-width="14" stroke-linecap="round"/>
    <!-- Mouthpiece -->
    <path d="M 435 225 L 475 225 L 485 215 L 485 235 L 475 225" fill="#c5a059" stroke="#775a19" stroke-width="6"/>
    <!-- 3 Valve Casings -->
    <rect x="250" y="210" width="18" height="120" rx="4" fill="#775a19"/>
    <rect x="280" y="210" width="18" height="120" rx="4" fill="#775a19"/>
    <rect x="310" y="210" width="18" height="120" rx="4" fill="#775a19"/>
    <!-- Valve caps & finger buttons -->
    <circle cx="259" cy="195" r="9" fill="#c5a059"/>
    <circle cx="289" cy="195" r="9" fill="#c5a059"/>
    <circle cx="319" cy="195" r="9" fill="#c5a059"/>
    <!-- Piston stems -->
    <line x1="259" y1="195" x2="259" y2="210" stroke="#775a19" stroke-width="4"/>
    <line x1="289" y1="195" x2="289" y2="210" stroke="#775a19" stroke-width="4"/>
    <line x1="319" y1="195" x2="319" y2="210" stroke="#775a19" stroke-width="4"/>
  </g>
  <!-- Musical notation staves in subtle parchment lines -->
  <line x1="80" y1="420" x2="432" y2="420" stroke="#d1c5b4" stroke-width="3"/>
  <line x1="80" y1="432" x2="432" y2="432" stroke="#d1c5b4" stroke-width="3"/>
  <line x1="80" y1="444" x2="432" y2="444" stroke="#d1c5b4" stroke-width="3"/>
</svg>
